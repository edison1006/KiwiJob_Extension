<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440">
  <defs>
    <linearGradient id="bg" x1="22" y1="16" x2="412" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.58" stop-color="#172554"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".34"/>
    </filter>
  </defs>

  <g transform="translate(0 80)">
  <rect width="440" height="280" fill="url(#bg)"/>
  <circle cx="399" cy="23" r="91" fill="#38BDF8" opacity=".09"/>
  <circle cx="29" cy="267" r="112" fill="#2DD4BF" opacity=".08"/>

  <g transform="translate(30 31)">
    <rect width="48" height="48" rx="14" fill="#FFFFFF" opacity=".96"/>
    <path d="M14 29c11-1 17-8 21-18 2 12-2 23-15 27-4 1-8-1-10-4 5 0 9-1 12-3-3 0-6-1-8-2Z"
          fill="url(#accent)"/>
  </g>

  <text x="92" y="63" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="28" font-weight="760" letter-spacing="-.6">KiwiJob</text>

  <text x="30" y="123" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="29" font-weight="760" letter-spacing="-.55">Save jobs. Match your CV.</text>
  <text x="30" y="153" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="15" font-weight="500">Track every application from your Chrome side panel.</text>

  <g transform="translate(30 190)" filter="url(#shadow)">
    <rect width="112" height="42" rx="21" fill="#FFFFFF"/>
    <circle cx="23" cy="21" r="7" fill="#2563EB"/>
    <text x="38" y="27" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="14" font-weight="700">Save jobs</text>
  </g>
  <g transform="translate(154 190)" filter="url(#shadow)">
    <rect width="125" height="42" rx="21" fill="#FFFFFF"/>
    <circle cx="23" cy="21" r="7" fill="#0D9488"/>
    <text x="38" y="27" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="14" font-weight="700">CV match</text>
  </g>
  <g transform="translate(291 190)" filter="url(#shadow)">
    <rect width="119" height="42" rx="21" fill="#FFFFFF"/>
    <circle cx="23" cy="21" r="7" fill="#7C3AED"/>
    <text x="38" y="27" fill="#0F172A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
          font-size="14" font-weight="700">Track</text>
  </g>

  <text x="30" y="258" fill="#94A3B8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
